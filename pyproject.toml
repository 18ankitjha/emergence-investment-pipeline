[project]
name = "emergence-investment-pipeline"
version = "0.1.0"
description = "AI-augmented startup sourcing, evidence, analysis, and memo pipeline for the Emergence take-home."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "pydantic>=2.8.2",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
]

[project.scripts]
invest-pipeline = "investment_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
